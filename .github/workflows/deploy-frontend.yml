name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ss-app-frontend/**'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Una página real por producto (/producto/{slug}/) y el sitemap. Se
      # generan aquí y no se versionan: dependen del catálogo vivo, no del repo.
      - name: Generar fichas de producto y sitemap
        run: node ss-app-frontend/herramientas/generar-fichas.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ss-app-frontend

      - id: deployment
        uses: actions/deploy-pages@v4
